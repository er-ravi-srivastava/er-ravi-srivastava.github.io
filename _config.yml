# Welcome to Jekyll!
locale: "en-US"
site_theme: "default"  # Options: default, air, sunrise, mint, dirt, contrast

title: "Ravi's Homepage"
title_separator: "-"
name: &name "Ravi Prakash Srivastava"
description: &description "Software Engineer & Researcher | AI Security, MLOps, Adversarial Machine Learning | M.Tech Data Science & AI @ IIIT Ranchi"

url: "https://er-ravi-srivastava.github.io"  # Your site URL
baseurl: ""  # Empty for user sites
repository: "er-ravi-srivastava/er-ravi-srivastava.github.io" 

author:
  avatar: "picture_resized.png"
  name: "Ravi Prakash Srivastava"
  bio: "Software Engineer · AI Security · MLOps Researcher"
  location: "India"
  email: "raviprakashshrivastav7@gmail.com"
  orcid: "0009-0009-3255-8758"
  arxiv: "https://arxiv.org/abs/2512.04967v1"




# Publication categories
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'
  preprints:
    title: 'Preprints'

# Other defaults
teaser: ""
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
comments:
  provider: false
atom_feed:
  hide: false

# Analytics/SEO (optional)
analytics:
  provider: false
google_site_verification: ""

# Collections (enable publications/portfolio)
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults for layouts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

# Sass/plugins
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
permalink: /:categories/:title/
timezone: Etc/UTC
